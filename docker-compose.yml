version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: honeystack-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-honeystack_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-honeystack_secure_pass_123}
      POSTGRES_DB: ${POSTGRES_DB:-honeystack_db}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-honeystack_admin} -d ${POSTGRES_DB:-honeystack_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    container_name: honeystack-cache
    networks:
      - backend-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: honeystack-api
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CAMPAIGN_THRESHOLD=${CAMPAIGN_THRESHOLD}
      - CAMPAIGN_WINDOW_HOURS=${CAMPAIGN_WINDOW_HOURS}
    networks:
      - ingest-net
      - backend-net
      - frontend-net
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: honeystack-worker
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY}
      - CAMPAIGN_THRESHOLD=${CAMPAIGN_THRESHOLD}
      - CAMPAIGN_WINDOW_HOURS=${CAMPAIGN_WINDOW_HOURS}
    networks:
      - backend-net
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: ./scheduler
      dockerfile: Dockerfile
    container_name: honeystack-scheduler
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DATA_RETENTION_DAYS=${DATA_RETENTION_DAYS}
    networks:
      - backend-net
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  ssh-sensor:
    build:
      context: ./ssh-sensor
      dockerfile: Dockerfile
    container_name: honeystack-ssh-sensor
    environment:
      - API_URL=http://api:8000/api/v1/events
      - SHELL_LOGIN_PERCENTAGE=${SHELL_LOGIN_PERCENTAGE}
    ports:
      - "${SSH_PORT:-2222}:2222"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - ingest-net
    depends_on:
      - api
    restart: unless-stopped

  http-sensor:
    build:
      context: ./http-sensor
      dockerfile: Dockerfile
    container_name: honeystack-http-sensor
    environment:
      - API_URL=http://api:8000/api/v1/events
    ports:
      - "${HTTP_PORT:-8081}:8080"
    networks:
      - ingest-net
    depends_on:
      - api
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: honeystack-dashboard
    ports:
      - "${DASHBOARD_PORT:-3000}:80"
    networks:
      - frontend-net
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  ingest-net:
    driver: bridge
    internal: true
  backend-net:
    driver: bridge
  frontend-net:
    driver: bridge
